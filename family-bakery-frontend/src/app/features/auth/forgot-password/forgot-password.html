<main class="auth-main">
  <section class="auth-card">
    <div class="auth-aside">
      <i class="fa-solid fa-wheat-awn"></i>
      <span class="eyebrow">A fresh start</span>

      <h1>We'll help you<br /><em>get back in.</em></h1>

      <p>Enter the email address associated with your account.</p>
    </div>

    <form class="auth-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
      <span class="eyebrow">Account help</span>

      <h2>Forgot password?</h2>

      <p class="form-intro">We'll take it from here.</p>

      <label
        [class.invalid]="
          forgotPasswordForm.controls.email.invalid && forgotPasswordForm.controls.email.touched
        "
      >
        Email address

        <input
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          autocomplete="email"
        />

        @if (forgotPasswordForm.controls.email.touched) {
          @if (forgotPasswordForm.controls.email.hasError('required')) {
            <small class="field-error">Email address is required.</small>
          } @else if (forgotPasswordForm.controls.email.hasError('email')) {
            <small class="field-error">Please enter a valid email address.</small>
          }
        }
      </label>

      <button class="button button-primary submit-button" type="submit">
        Continue <i class="fa-solid fa-arrow-right"></i>
      </button>

      <p class="form-foot">
        <a routerLink="/login">Back to log in</a>
      </p>

      <p class="info-note">Password reset delivery will be implemented by the backend.</p>

      <div
        class="form-message"
        [class.success]="statusType === 'success'"
        [class.error]="statusType === 'error'"
        aria-live="polite"
      >
        {{ statusMessage }}
      </div>
    </form>
  </section>
</main>
