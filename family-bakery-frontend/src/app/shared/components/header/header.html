<header class="site-header">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <span class="brand-mark">
      <i class="fa-solid fa-wheat-awn"></i>
    </span>
    <span>Family <b>Bakery</b></span>
  </a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="Toggle navigation"
    [attr.aria-expanded]="menuOpen"
    (click)="toggleMenu()"
  >
    <i
      [class.fa-bars]="!menuOpen"
      [class.fa-xmark]="menuOpen"
      class="fa-solid"
    ></i>
  </button>

  <nav class="main-nav" [class.open]="menuOpen">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      Home
    </a>

    <a
      routerLink="/"
      fragment="about"
      (click)="closeMenu()"
    >
      About
    </a>

    <a
      routerLink="/shop"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Shop
    </a>

    <a
      routerLink="/contact"
      routerLinkActive="active"
      (click)="closeMenu()"
    >
      Contact
    </a>
  </nav>

  <div class="header-actions">
    <a
      class="account-link"
      routerLink="/login"
      aria-label="My account"
    >
      <i class="fa-regular fa-user"></i>
      <span>Account</span>
    </a>

    <a
      class="cart-link"
      routerLink="/cart"
      aria-label="Shopping cart"
    >
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Cart</span>
      <span class="cart-count">{{ cart.totalItems() }}</span>
    </a>
  </div>
</header>
